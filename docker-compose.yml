services:
  # --- Database migrations (runs once on startup) ---
  migrations:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head
    restart: "no"

  # --- FastAPI application ---
  api:
    build: .
    ports:
      - "8001:8000"
    env_file: .env
    volumes:
      - ./app:/app/app  # hot reload
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # --- Celery worker ---
  celery_worker:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: celery -A tasks.celery_app worker --loglevel=info --concurrency=2

  # --- Celery beat scheduler ---
  celery_beat:
    build: .
    env_file: .env
    depends_on:
      - celery_worker
    command: celery -A tasks.celery_app beat --loglevel=info

  # --- Telegram bot ---
  telegram_bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: python -m bot.main

  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskmanager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis ---
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
